project:
  name: pretraining-dry-run
  output_dir: outputs

storage:
  provider: gcs
  bucket: pretraining-corpus
  dataset_prefix: pretraining/staged-input
  work_prefix: pretraining/datatrove-work
  output_prefix: pretraining/dedup-output
  # THE token artifact. `dapper tokenize` writes bin-partitioned WebDataset
  # shards here in one pass: tokens/<bin>/shard-<source>-<rank>-<seq>.tar,
  # plus tokens/_manifest/ (capacities) and tokens/_runs/<source>/ (run state).
  # There is no Parquet intermediate and no second regrouping stage.
  tokens_prefix: pretraining/tokens

# Shared by token counting, ordinary tokenization, and clustered packing.
# Document text is always encoded independently; Dapper inserts the frozen EOS
# boundary and applies padding masks itself.
tokenizer:
  name: zai-org/GLM-5.2
  add_special_tokens: false
  boundary:
    token: eos
    after_each_document: true
    include_in_loss: true
  padding:
    token: pad
    label_value: -100
    # GLM-5.2 has no distinct PAD token; reuse EOS with padding masks.
    reuse_eos: true

ray:
  address: auto
  # Display-only aliases. Prefer setting DAPPER_NODE_NAME independently in
  # each node's Ray service environment (for example: head, worker-01). As a
  # fallback, map a Ray node ID, node address, or hostname to an alias here.
  # These values are labels, never credentials.
  node_names: {}
  # Internal node addresses stay out of the dashboard unless explicitly enabled.
  show_node_addresses: false
  # `dapper ray init` starts Ray on existing GCE VMs. Instance identity is
  # configuration, not a credential; gcloud/OS Login owns SSH authentication.
  # Resolve private topology values from the head node's untracked .env file.
  bootstrap:
    provider: gcloud
    head_name: head
    head_address: auto
    port: ${DAPPER_RAY_PORT}
    dashboard_host: 127.0.0.1
    dashboard_port: 8265
    # Fixed private ports make the VPC firewall contract auditable.
    object_manager_port: 8076
    node_manager_port: 8077
    ray_client_server_port: 10001
    min_worker_port: 10002
    max_worker_port: 10500
    dashboard_agent_listen_port: 52365
    dashboard_agent_grpc_port: 52366
    runtime_env_agent_port: 52367
    ray_executable: ray
    use_internal_ip: true
    # Bound validation of an already-open control port before replacing stale Ray.
    control_plane_timeout_seconds: 15
    # Workers may need several minutes to accept SSH and register their
    # raylets, especially when starting a full multi-zone cluster.
    startup_timeout_seconds: 300
    poll_seconds: 1
    # Numbered DAPPER_RAY_WORKER_<NN>_INSTANCE/ZONE pairs in .env define the
    # complete worker set. Dapper derives the required node count from them.
    worker_env_prefix: DAPPER_RAY_WORKER

cluster:
  executor: ray
  library: sklearn
  method: minibatch_kmeans
  logical_clusters: 128
  sample_documents: 1000000
  seed: 0
  features:
    word:
      analyzer: word
      ngram_range: [1, 2]
      dimensions: 262144
      weight: 0.8
    character:
      analyzer: char_wb
      ngram_range: [3, 5]
      dimensions: 131072
      weight: 0.2
    normalization: l2
  fit:
    batch_size: 8192
    epochs: 10
    n_init: auto
  workers: auto
  max_workers: null
  cpus_per_task: 1
  memory_gb_per_task: 3
  task_oversubscription: 4
  physical_shuffle_partitions: auto
  # Fine-grained enough to keep a 448-CPU cluster busy for the 52.7 GiB
  # FineWeb archive while retaining multiple scheduling waves.
  target_partition_bytes: 67108864

pack:
  contexts:
    8192: 1.0
  workers: auto
  max_workers: null
  cpus_per_task: 1
  memory_gb_per_task: 4
  task_oversubscription: 4
  planner: best_fit
  seed: 0
  max_open_packs_per_context: 4096
  max_documents_per_pack: 32
  max_same_host_per_pack: 2
  attention:
    cross_document: false
    reset_position_ids: true
  fallback:
    - same_physical_partition
    - same_logical_cluster
    - global
    - pad

tokenize:
  # Roll a shard past this many bytes, per task per bin. 250 MiB puts the
  # dominant bin at ~1 shard per task, which is already well sized.
  shard_bytes: 268435456
  # Per-bin overrides. WebDataset assigns whole shards to DataLoader workers,
  # so a bin with fewer shards than workers leaves workers idle -- rare bins
  # want a smaller threshold than the dominant one.
  shard_bytes_by_bin:
    262144: 20971520
  # Without this, shards inherit CommonCrawl crawl order and each holds ~150k
  # correlated documents. 0 buffers the whole task, which is a full shuffle of
  # everything one task can see.
  shuffle: true
  shuffle_seed: 0
  shuffle_buffer: 0

huggingface:
  download_mode: streaming
  # Current Hugging Face fast path. `hf_transfer` is deprecated; recent
  # huggingface_hub uses `hf_xet` automatically when installed, and this asks
  # it to maximize network/disk throughput.
  xet_high_performance: true
  # Optional advanced knob; leave unset to use hf_xet adaptive defaults.
  # xet_num_concurrent_range_gets: 16
  # Ray archive fast path: keep one remote Parquet handle open per native shard
  # and read large cached ranges instead of reopening ~1,000 row groups.
  parquet_range_bytes: 134217728
  parquet_batch_rows: 65536
  # Whole-file Xet downloads avoid thousands of remote Parquet seeks. These
  # high-memory nodes can safely hold the bounded 2 GiB/task spool in RAM.
  parquet_spool_dir: /dev/shm
  ray_cpus_per_task: 4
  ray_memory_gb_per_task: 4
  # Dapper already fans out many files. Bound each Xet client instead of using
  # per-process high-performance mode (which tries to saturate a whole node).
  ray_xet_fixed_download_concurrency: 2
  # ray_max_workers: 168  # optional global cap; auto derives from resources
  dry_run_sample_records: 2
  trust_remote_code: false

schemas:
  pretraining:
    text_fields: ["text", "content", "document"]
    id_fields: ["id", "doc_id", "uuid", "seed_data"]
    url_fields: ["url", "metadata.url"]
    token_count_fields: ["token_count", "num_tokens"]

dedup:
  schema: pretraining
  # Inclusive upper bounds. A document of exactly 8192 tokens lands in the 8192
  # bin; 8193 moves up. The final bin is unbounded, so nothing is dropped.
  len_bins: [8192, 65536, 262144]
  remote:
    runner: null
  datatrove:
    # Bare `dapper dedup` remains local. `dapper dedup --gcs --ray` overrides
    # this with DataTrove's native RayPipelineExecutor and connects to the
    # already-running Dapper Ray cluster; it does not open another port.
    executor: local
    work_dir: .dapper/dedup/datatrove
    n_grams: 5
    num_buckets: 14
    hashes_per_bucket: 8
    precision: 64
    # `tasks` is a floor: both the dedup and tokenize runners raise it to the
    # input shard count so the work is actually divisible.
    tasks: 1
    # `workers` is NOT auto-scaled -- it caps how many tasks run at once, so
    # leaving it at 1 serializes the whole run no matter how many tasks exist.
    # Bounded by RAM, not cores: each worker loads its own tokenizer (~231MB
    # measured for GLM-5.2), and this host has ~9GB free against 20 cores.
    # These runs are GCS-read-bound, so this is mostly I/O concurrency.
    workers: 8
    ray:
      # Auto-sized CPU stages reserve every registered core when the cluster is
      # otherwise idle. Ray queues them safely behind an archive already using
      # those logical resources, and newly-added nodes become usable capacity.
      task_oversubscription: 4
      workers_per_bucket: 32
      signatures:
        workers: auto
        cpus_per_task: 1
        memory_gb_per_task: 2
      buckets:
        workers: auto
        cpus_per_task: 1
        memory_gb_per_task: 2
      # DataTrove's global union/find stage has one owner by design. Extra CPU
      # helps its native code without pretending the state is distributed.
      clusters:
        workers: 1
        cpus_per_task: 8
        memory_gb_per_task: 48
      filter:
        workers: auto
        cpus_per_task: 1
        memory_gb_per_task: 4

# The corpus. Sources are grouped by the loader that reads them, so the block
# key supplies the type -- no `type:` field on every entry.
#
# Additional vetted sources are listed in the README under
# "Corpus sources (TODO)"; each is promotable as one entry here.
corpus:
  defaults:
    split: train
    mode: pretraining

  # `domain` and `subdomain` are SOURCE-LEVEL assertions, not content
  # classification -- there is no classifier in Dapper. A label means "this
  # source is declared to be X", so a heterogeneous crawl tagged general_web
  # still contains code, math, and reference material internally.
  #
  # Domains must match the keys in mixture.yaml or `dapper mixture check`
  # reports the cell as having zero capacity.
  #
  # `dataset_config` is left unset where the config name is unknown; run
  # `dapper dedup --dry-run` to sample each source and confirm the text field
  # and real config before committing to a full archive.
  sources:
    huggingface:

      # ---- general_web ----------------------------------------------------
      # Full FineWeb. Stage it with:
      #   dapper archive --sources fineweb --ray
      # It uses a distinct archive directory so the previously staged
      # sample-10BT corpus cannot satisfy or contaminate resume state.
      - name: fineweb
        repo: "HuggingFaceFW/fineweb"
        dataset_config: default
        archive_name: fineweb-default
        domain: general_web
        license: ODC-By-1.0
      - name: dclm-pro
        repo: "gair-prox/DCLM-pro"
        domain: general_web
      # DCLM baseline. The `dclm-pool-*` variants are the same pool at
      # different scales -- one entry, not seven.
      - name: dclm-baseline
        repo: "mlfoundations/dclm-baseline-1.0"
        domain: general_web
      - name: nemotron-climbmix
        repo: "nvidia/Nemotron-ClimbMix"
        domain: general_web
      # Splits are languages (`en`, `zh`), not train/test, so the
      # corpus.defaults `split: train` has to be overridden here.
      - name: ultra-fineweb
        repo: "openbmb/Ultra-FineWeb"
        split: en
        domain: general_web
      # Configs: all | faq | math | table | tutorial. Taken individually
      # rather than as `all`, because `math` belongs in the mathematics domain
      # and `all` would bury it under general_web.
      - name: finephrase-faq
        repo: "HuggingFaceFW/finephrase"
        dataset_config: faq
        domain: general_web
      - name: finephrase-table
        repo: "HuggingFaceFW/finephrase"
        dataset_config: table
        domain: general_web
      - name: finephrase-tutorial
        repo: "HuggingFaceFW/finephrase"
        dataset_config: tutorial
        domain: education_reference
      - name: essential-web
        repo: "EssentialAI/essential-web-v1.0"
        domain: general_web
      - name: zyda-2
        repo: "Zyphra/Zyda-2"
        archive_name: zyda-2-ray
        domain: general_web
      - name: falcon-refinedweb
        repo: "tiiuae/falcon-refinedweb"
        domain: general_web
      - name: aicc
        repo: "opendatalab/AICC"
        domain: general_web
      - name: txt360
        repo: "LLM360/TxT360"
        domain: general_web
      - name: recycling-the-web
        repo: "facebook/recycling_the_web"
        domain: general_web
      # 113 configs. `en` is the cleaned English split; `en.noclean` and
      # `en.noblocklist` are deliberately *less* filtered, so this is a data
      # quality choice, not a formality.
      - name: c4
        repo: "allenai/c4"
        dataset_config: en
        domain: general_web
      # Requires Terms & Conditions (gated=auto): accept the terms on the dataset page.
      # https://huggingface.co/datasets/SII-GAIR-NLP/davinci-llm-data
      # Then uncomment. Left active, it fails every run and forces exit 3.
      # - name: davinci-llm-data
      #   repo: "SII-GAIR-NLP/davinci-llm-data"
      #   domain: general_web
      # Requires Terms & Conditions (gated=manual): request access; the author approves manually.
      # https://huggingface.co/datasets/nvidia/Nemotron-CC-v2.1
      # Then uncomment. Left active, it fails every run and forces exit 3.
      # - name: nemotron-cc-v2.1
      #   repo: "nvidia/Nemotron-CC-v2.1"
      #   domain: general_web
      # Dolma 3. The ten `dolma3_*` pool/mix variants are the same corpus at
      # different sizes and blends -- archiving several re-downloads the same
      # documents. The 6T mix is the primary pretraining set.
      - name: dolma3-mix-6t
        repo: "allenai/dolma3_mix-6T-1025-7B"
        domain: general_web

      # ---- education_reference --------------------------------------------
      - name: finepdfs-edu
        repo: "HuggingFaceFW/finepdfs-edu"
        domain: education_reference
      - name: common-pile-wikimedia
        repo: "common-pile/wikimedia"
        domain: education_reference
      - name: libretexts
        repo: "common-pile/libretexts"
        domain: education_reference
      - name: oercommons
        repo: "common-pile/oercommons"
        domain: education_reference

      # ---- code -----------------------------------------------------------
      # Subdomains are declared per source. A single source cannot split
      # itself, so repo_connected vs docs/tests vs agent traces each need
      # their own entry -- see the mixture.yaml code breakdown.
      - name: stack-v3
        repo: "HuggingFaceCode/stack-v3-train"
        domain: code
        subdomain: repo_connected
      # Requires Terms & Conditions (gated=manual): request access; the author approves manually.
      # https://huggingface.co/datasets/nvidia/Nemotron-Pretraining-Code-v1
      # Then uncomment. Left active, it fails every run and forces exit 3.
      # - name: nemotron-code-v1
      #   repo: "nvidia/Nemotron-Pretraining-Code-v1"
      #   domain: code
      #   subdomain: repo_connected
      # Requires Terms & Conditions (gated=manual): request access; the author approves manually.
      # https://huggingface.co/datasets/nvidia/Nemotron-Pretraining-Code-v2
      # Then uncomment. Left active, it fails every run and forces exit 3.
      # - name: nemotron-code-v2
      #   repo: "nvidia/Nemotron-Pretraining-Code-v2"
      #   domain: code
      #   subdomain: repo_connected
      - name: nemotron-code-v3
        repo: "nvidia/Nemotron-Pretraining-Code-v3"
        domain: code
        subdomain: repo_connected
      # Requires Terms & Conditions (gated=manual): request access; the author approves manually.
      # https://huggingface.co/datasets/nvidia/Nemotron-CC-Code-v1
      # Then uncomment. Left active, it fails every run and forces exit 3.
      # - name: nemotron-cc-code
      #   repo: "nvidia/Nemotron-CC-Code-v1"
      #   domain: code
      #   subdomain: other
      # Openly licensed subset of The Stack v2.
      - name: common-pile-stackv2
        repo: "common-pile/stackv2"
        domain: code
        subdomain: repo_connected

      # ---- mathematics ----------------------------------------------------
      - name: automathtext-v2
        repo: "OpenSQZ/AutoMathText-V2"
        domain: mathematics
      # Requires Terms & Conditions (gated=auto): accept the terms on the dataset page.
      # https://huggingface.co/datasets/nvidia/Nemotron-CC-Math-v1
      # Then uncomment. Left active, it fails every run and forces exit 3.
      # - name: nemotron-cc-math
      #   repo: "nvidia/Nemotron-CC-Math-v1"
      #   domain: mathematics
      - name: finephrase-math
        repo: "HuggingFaceFW/finephrase"
        dataset_config: math
        domain: mathematics

      # ---- science_technical ----------------------------------------------
      - name: arxiv-papers
        repo: "common-pile/arxiv_papers"
        domain: science_technical
      - name: arxiv-abstracts
        repo: "common-pile/arxiv_abstracts_filtered"
        domain: science_technical
      # Four topic configs, each a distinct sub-dataset. A single entry would
      # have to pick one, so they are listed separately and domain-mapped.
      - name: nemotron-fact-seeking
        repo: "nvidia/Nemotron-Pretraining-Specialized-v1.2"
        dataset_config: Nemotron-Pretraining-Fact-Seeking
        domain: science_technical
      - name: nemotron-generative
        repo: "nvidia/Nemotron-Pretraining-Specialized-v1.2"
        dataset_config: Nemotron-Pretraining-Generative
        domain: science_technical
      - name: nemotron-multiple-choice
        repo: "nvidia/Nemotron-Pretraining-Specialized-v1.2"
        dataset_config: Nemotron-Pretraining-Multiple-Choice
        domain: education_reference
      # Moral scenarios are ethics prompts, not science.
      - name: nemotron-moral-scenarios
        repo: "nvidia/Nemotron-Pretraining-Specialized-v1.2"
        dataset_config: Nemotron-Pretraining-Moral-Scenarios
        domain: other
      # Semantic Scholar open research corpus.
      - name: pes2o
        repo: "common-pile/peS2o"
        domain: science_technical
      - name: pubmed
        repo: "common-pile/pubmed"
        domain: science_technical

      # ---- legal_government -----------------------------------------------
      # 13 configs. Taken as the ones that are legal *text*; the rest
      # (CaseHOLD, *-QA, *-Classification) are evaluation tasks rather than
      # pretraining prose.
      - name: nemotron-legal-ecfr
        repo: "nvidia/Nemotron-Pretraining-Legal-v1"
        dataset_config: Nemotron-Pretraining-Legal-eCFR
        domain: legal_government
      - name: nemotron-legal-ca-regs
        repo: "nvidia/Nemotron-Pretraining-Legal-v1"
        dataset_config: Nemotron-Pretraining-Legal-California-Code-Of-Regulations
        domain: legal_government
      - name: nemotron-legal-case-summary
        repo: "nvidia/Nemotron-Pretraining-Legal-v1"
        dataset_config: Nemotron-Pretraining-Legal-Case-Law-Summary
        domain: legal_government
      - name: nemotron-legal-globalcit
        repo: "nvidia/Nemotron-Pretraining-Legal-v1"
        dataset_config: Nemotron-Pretraining-Legal-GlobalCit
        domain: legal_government
      - name: nemotron-legal-judicial-ethics
        repo: "nvidia/Nemotron-Pretraining-Legal-v1"
        dataset_config: Nemotron-Pretraining-Legal-NYCourts-Judicial-Ethics-Opinions
        domain: legal_government
      - name: caselaw-access-project
        repo: "common-pile/caselaw_access_project"
        domain: legal_government
      - name: library-of-congress
        repo: "common-pile/library_of_congress"
        domain: legal_government
      # US Government Publishing Office.
      - name: usgpo
        repo: "common-pile/usgpo_filtered"
        domain: legal_government
      - name: regulations
        repo: "common-pile/regulations"
        domain: legal_government

      # ---- books_longform -------------------------------------------------
      # Openly licensed and public domain only. common-pile's remit is
      # "openly licensed and public domain text".
      - name: finepdfs
        repo: "HuggingFaceFW/finepdfs"
        domain: books_longform
      - name: biodiversity-heritage-library
        repo: "common-pile/biodiversity_heritage_library_filtered"
        domain: books_longform
      - name: project-gutenberg
        repo: "common-pile/project_gutenberg"
        domain: books_longform
      - name: pre-1929-books
        repo: "common-pile/pre_1929_books"
        domain: books_longform
      # Directory of Open Access Books.
      - name: doab
        repo: "common-pile/doab_filtered"
        domain: books_longform

      # ---- conversation_forum ---------------------------------------------
      # Threaded dialogue. StackExchange (CC-BY-SA) is the volume here;
      # transcripts are largely monologue and sit last for that reason.
      - name: stackexchange
        repo: "common-pile/stackexchange"
        domain: conversation_forum
      - name: ubuntu-irc
        repo: "common-pile/ubuntu_irc"
        domain: conversation_forum
      - name: hn-pep-discussions
        repo: "common-pile/python_enhancement_proposals"
        domain: conversation_forum
      - name: youtube-transcripts
        repo: "common-pile/youtube_filtered"
        domain: conversation_forum

      # ---- other ----------------------------------------------------------
      # `synthetic: true` marks generated text, which the schema tracks
      # separately from domain.
      - name: pleias-synth
        repo: "PleIAs/SYNTH"
        domain: other
        synthetic: true
      # 8 configs, and they span domains -- one entry would have buried
      # auto_math_text under `other`.
      - name: cosmopedia-math
        repo: "HuggingFaceTB/cosmopedia"
        dataset_config: auto_math_text
        domain: mathematics
        synthetic: true
      - name: cosmopedia-khanacademy
        repo: "HuggingFaceTB/cosmopedia"
        dataset_config: khanacademy
        domain: education_reference
        synthetic: true
      - name: cosmopedia-openstax
        repo: "HuggingFaceTB/cosmopedia"
        dataset_config: openstax
        domain: education_reference
        synthetic: true
      - name: cosmopedia-stanford
        repo: "HuggingFaceTB/cosmopedia"
        dataset_config: stanford
        domain: education_reference
        synthetic: true
      - name: cosmopedia-wikihow
        repo: "HuggingFaceTB/cosmopedia"
        dataset_config: wikihow
        domain: education_reference
        synthetic: true
      - name: cosmopedia-stories
        repo: "HuggingFaceTB/cosmopedia"
        dataset_config: stories
        domain: books_longform
        synthetic: true
      - name: cosmopedia-web-v2
        repo: "HuggingFaceTB/cosmopedia"
        dataset_config: web_samples_v2
        domain: general_web
        synthetic: true
      # HuggingFaceFW/fineweb-2 removed: it is the NON-English companion to
      # FineWeb and publishes no English config among its 1,870 languages.
      # English web text comes from `fineweb` above. Revisit only if the
      # mixture gains a multilingual domain.
