[project]
name = "dapper-datasets"
version = "0.1.0"
description = "Dapper - Dataset Absurdly Powerful Parser Engineered Recklessly"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.0.0",
    "textual>=7.3.0",
    "pyarrow>=15.0.0",
    "PyYAML>=6.0.0",
    "datasets>=2.18.0",
    "huggingface-hub>=1.3.2",
    "requests>=2.32.5",
    "aiohttp>=3.13.3",
    "aiofiles>=25.1.0",
    "datatrove[processing]>=0.6.0",
    # Writes the tar shards `dapper tokenize` produces. Pure Python
    # (braceexpand, numpy, pyyaml) -- the format is defined by this library, so
    # it should be produced by it rather than by our reading of the spec.
    "webdataset>=0.2.0",
    # Several sources ship zstd-compressed shards (DCLM baseline, dolma3,
    # recycling_the_web). Without this, `datasets` raises
    # "Compression type zstd not supported" at load time.
    "zstandard>=0.22.0",
    "orjson>=3.10.0",
    "spacy>=3.7.0",
    "transformers>=4.44.0",
    "sentencepiece>=0.2.0",
    "gcsfs>=2024.6.0",
    "ray[default]>=2.40.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0.0"]
all = ["pyarrow>=15.0.0"]

[project.scripts]
dapper = "dapper.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dapper*", "scripts*", "utils*"]

[tool.setuptools.package-data]
"dapper.tui" = ["styles/*.tcss"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: exercises local datasets or external-scale resources",
]
