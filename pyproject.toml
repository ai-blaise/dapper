[project]
name = "dapper-datasets"
version = "0.1.0"
description = "Dapper - Dataset Absurdly Powerful Parser Engineered Recklessly"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=7.3.0",
    "pyarrow>=15.0.0",
    "PyYAML>=6.0.0",
    "datasets>=2.18.0",
    "huggingface-hub>=1.3.2",
    "requests>=2.32.5",
    "aiohttp>=3.13.3",
    "aiofiles>=25.1.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0.0"]
all = ["pyarrow>=15.0.0"]

[project.scripts]
dapper = "dapper.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dapper*", "scripts*", "utils*"]

[tool.setuptools.package-data]
"dapper.tui" = ["styles/*.tcss"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
